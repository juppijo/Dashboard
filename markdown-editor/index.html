<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD // Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Literata:ital,wght@0,400;0,600;1,400&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">

  <!-- Kopfzeile -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">MD</span>
      <span class="brand-slash">//</span>
      <span class="brand-name">Editor</span>
    </div>

    <div class="filename-wrap">
      <input type="text" id="docTitle" class="doc-title" value="unbenannt" spellcheck="false">
      <span class="doc-ext">.md</span>
    </div>

    <div class="topbar-actions">
      <span class="save-indicator" id="saveIndicator">gespeichert</span>

      <div class="settings-wrap">
        <button class="icon-btn" id="btnSettings" title="Darstellung anpassen" aria-label="Einstellungen">
          <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>

        <div class="settings-panel" id="settingsPanel" hidden>
          <div class="settings-section">
            <span class="settings-label">Hintergrundfarbe</span>
            <div class="swatch-row" id="bgSwatches">
              <button class="swatch" data-bg="#121212" style="--sw:#121212" title="Anthrazit (Standard)"></button>
              <button class="swatch" data-bg="#0d1130" style="--sw:#0d1130" title="Mitternachtsblau"></button>
              <button class="swatch" data-bg="#30130d" style="--sw:#30120d" title="Espresso"></button>
              <button class="swatch" data-bg="#10300f" style="--sw:#10300f" title="Waldgrün"></button>
              <button class="swatch" data-bg="#222222" style="--sw:#222222" title="Kohle"></button>
              <button class="swatch" data-bg="#f4f1ea" style="--sw:#f4f1ea" title="Papier (hell)"></button>
              <label class="swatch swatch-custom" title="Eigene Farbe">
                <input type="color" id="bgCustom" value="#121212">
              </label>
            </div>
          </div>

          <div class="settings-section">
            <span class="settings-label">Schriftart</span>
            <select id="fontSelect" class="settings-select">
              <option value="barlow">Barlow (Standard)</option>
              <option value="jetbrains">JetBrains Mono</option>
              <option value="georgia">Georgia (Serif)</option>
              <option value="literata">Literata (Serif)</option>
              <option value="system">Systemschrift</option>
              <option value="atkinson">Atkinson Hyperlegible</option>
            </select>
          </div>

          <div class="settings-section">
            <span class="settings-label">Textfarben (Vorschau)</span>
            <div class="color-field">
              <label for="colorH1">H1</label>
              <input type="color" id="colorH1" value="#e0bc4a">
            </div>
            <div class="color-field">
              <label for="colorH2">H2</label>
              <input type="color" id="colorH2" value="#c9a227">
            </div>
            <div class="color-field">
              <label for="colorH3">H3</label>
              <input type="color" id="colorH3" value="#c9a227">
            </div>
            <div class="color-field">
              <label for="colorP">Absatz</label>
              <input type="color" id="colorP" value="#e8e4da">
            </div>
          </div>

          <button class="settings-reset" id="btnResetSettings">Zurücksetzen</button>
        </div>
      </div>

      <button class="icon-btn" id="btnFullscreen" title="Vollbild (F11)" aria-label="Vollbild umschalten">
        <svg viewBox="0 0 24 24" class="ico ico-expand"><path d="M8 3H4a1 1 0 0 0-1 1v4M16 3h4a1 1 0 0 1 1 1v4M8 21H4a1 1 0 0 1-1-1v-4M16 21h4a1 1 0 0 0 1-1v-4"/></svg>
        <svg viewBox="0 0 24 24" class="ico ico-compress" style="display:none"><path d="M9 4v4a1 1 0 0 1-1 1H4M15 4v4a1 1 0 0 0 1 1h4M9 20v-4a1 1 0 0 0-1-1H4M15 20v-4a1 1 0 0 1 1-1h4"/></svg>
      </button>
    </div>
  </header>

  <!-- Werkzeugleiste -->
  <div class="toolbar" id="toolbar">
    <div class="tool-group">
      <button class="tool-btn" data-cmd="h1" title="Überschrift 1">H1</button>
      <button class="tool-btn" data-cmd="h2" title="Überschrift 2">H2</button>
      <button class="tool-btn" data-cmd="h3" title="Überschrift 3">H3</button>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group">
      <button class="tool-btn" data-cmd="bold" title="Fett (Strg+B)"><b>F</b></button>
      <button class="tool-btn" data-cmd="italic" title="Kursiv (Strg+I)"><i>K</i></button>
      <button class="tool-btn" data-cmd="strike" title="Durchgestrichen"><s>S</s></button>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group">
      <button class="tool-btn" data-cmd="quote" title="Zitat">
        <svg viewBox="0 0 24 24" class="ico"><path d="M7 7c-2.2 0-4 1.8-4 4s1.8 4 4 4c.2 2.2-1.3 4-3 5M17 7c-2.2 0-4 1.8-4 4s1.8 4 4 4c.2 2.2-1.3 4-3 5"/></svg>
      </button>
      <button class="tool-btn" data-cmd="code" title="Inline-Code">&lt;/&gt;</button>
      <button class="tool-btn" data-cmd="codeblock" title="Codeblock">{ }</button>
      <button class="tool-btn" data-cmd="hr" title="Trennlinie">—</button>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group">
      <button class="tool-btn" data-cmd="ul" title="Aufzählungsliste">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="4" cy="6" r="1.3"/><circle cx="4" cy="12" r="1.3"/><circle cx="4" cy="18" r="1.3"/><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/></svg>
      </button>
      <button class="tool-btn" data-cmd="ol" title="Nummerierte Liste">
        <svg viewBox="0 0 24 24" class="ico"><text x="1" y="9" font-size="7" fill="currentColor" stroke="none">1</text><text x="1" y="15" font-size="7" fill="currentColor" stroke="none">2</text><text x="1" y="21" font-size="7" fill="currentColor" stroke="none">3</text><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/></svg>
      </button>
      <button class="tool-btn" data-cmd="task" title="Aufgabenliste">☑</button>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group">
      <button class="tool-btn" data-cmd="link" title="Link einfügen (Strg+K)">🔗</button>
      <button class="tool-btn" data-cmd="image" title="Bild einfügen">🖼</button>
      <button class="tool-btn" data-cmd="table" title="Tabelle einfügen">▦</button>
    </div>

    <div class="tool-sep"></div>
    <div class="tool-group">
      <button class="tool-btn" data-cmd="mathinline" title="Formel inline (LaTeX, $...$)">∑x</button>
      <button class="tool-btn" data-cmd="mathblock" title="Formel als Block (LaTeX, $$...$$)">∫dx</button>
    </div>

    <div class="tool-sep tool-sep-grow"></div>

    <div class="tool-group view-switch" id="viewSwitch" role="tablist">
      <button class="view-btn is-active" data-view="edit" role="tab" aria-selected="true">Edit</button>
      <button class="view-btn" data-view="split" role="tab" aria-selected="false">Split</button>
      <button class="view-btn" data-view="preview" role="tab" aria-selected="false">Vorschau</button>
    </div>

    <div class="tool-sep"></div>

    <div class="tool-group">
      <button class="tool-btn" id="btnImport" title="Markdown-Datei laden">⇧</button>
      <button class="tool-btn" id="btnExport" title="Als .md exportieren">⇩ MD</button>
      <button class="tool-btn" id="btnExportHtml" title="Als .html exportieren">⇩ HTML</button>
      <button class="tool-btn" id="btnExportPdf" title="Als PDF exportieren / drucken">⇩ PDF</button>
      <input type="file" id="fileInput" accept=".md,.markdown,.txt" hidden>
    </div>
  </div>

  <!-- Arbeitsbereich -->
  <main class="workspace" id="workspace" data-view="edit">
    <section class="pane pane-edit" id="paneEdit">
      <textarea id="editor" class="editor" spellcheck="false" placeholder="# Willkommen

Schreib hier deinen Markdown-Text ...

**Fett**, *kursiv*, `Code` und mehr — wähle Text aus und nutze die Werkzeugleiste."></textarea>
    </section>

    <div class="pane-divider" id="paneDivider"></div>

    <section class="pane pane-preview" id="panePreview">
      <article id="preview" class="preview markdown-body"></article>
    </section>
  </main>

  <!-- Statusleiste -->
  <footer class="statusbar">
    <span id="statWords">0 Wörter</span>
    <span class="stat-sep">·</span>
    <span id="statChars">0 Zeichen</span>
    <span class="stat-sep">·</span>
    <span id="statLines">0 Zeilen</span>
    <span class="stat-sep">·</span>
    <span id="statReadtime">~0 Min. Lesezeit</span>
    <span class="stat-fill"></span>
    <span class="stat-hint">Strg+B Fett · Strg+I Kursiv · Strg+K Link · F11 Vollbild</span>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="script.js"></script>
</body>
</html>
