<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krims Kram – Elektronik-Lager</title>
<style>
:root{--bg:#f3efe6;--pn:#fffdf8;--pn2:#ece6d8;--tx:#262219;--mu:#7b7566;--ac:#d9731a;--ac2:#0f8b8d;--bd:#ddd4c2;--wr:#c0392b;--sh:0 6px 20px #0001;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13151a;--pn:#1c1f27;--pn2:#262a35;--tx:#ece9e1;--mu:#9a9c a8;--mu:#989aa6;--ac:#ff9a3c;--ac2:#3cc7c9;--bd:#323746;--wr:#ff6b5b;--sh:0 6px 20px #0006}}
:root[data-theme="dark"]{--bg:#13151a;--pn:#1c1f27;--pn2:#262a35;--tx:#ece9e1;--mu:#989aa6;--ac:#ff9a3c;--ac2:#3cc7c9;--bd:#323746;--wr:#ff6b5b;--sh:0 6px 20px #0006}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px;white-space:nowrap}.logo b{color:var(--ac)}
.search{flex:1;min-width:180px;display:flex}
.search input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);outline:none}
.search input:focus{border-color:var(--ac);box-shadow:0 0 0 3px #d9731a33}
.btn{border:1px solid var(--bd);background:var(--pn2);padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:var(--ac)}
.btn.pri{background:linear-gradient(135deg,var(--ac),#f0a030);color:#fff;border:0}
.btn.dan{color:var(--wr)}.btn.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
select{padding:9px 10px;border-radius:12px;border:1px solid var(--bd);background:var(--pn2);cursor:pointer}
aside{overflow:auto;padding:14px;border-right:1px solid var(--bd);background:var(--pn)}
main{overflow:auto;padding:18px 20px 90px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--pn2);border-radius:12px;padding:10px 12px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mu)}
.stat.w b{color:var(--wr)}
aside h5{margin:16px 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:9px;cursor:pointer;font-size:14px}
.row:hover{background:var(--pn2)}.row.on{background:var(--ac);color:#fff}.row i{font-style:normal;opacity:.65;font-size:12px}
.l1{padding-left:22px}.l2{padding-left:36px}
.chip{display:inline-block;background:var(--pn2);border-radius:99px;padding:2px 9px;font-size:12px;margin-right:4px}
.gh{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;font-size:18px}.gh:first-child{margin-top:0}.gh small{color:var(--mu);font-weight:400;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{position:relative;display:flex;gap:12px;background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:14px;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:var(--ac)}
.card.sel{outline:2px solid var(--ac2);background:var(--pn2)}
.ic{font-size:30px;width:48px;height:48px;border-radius:12px;background:var(--pn2);display:grid;place-items:center;flex:none}
.bd{min-width:0;flex:1}.bd h4{margin:0 0 4px;font-size:15px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.loc{font-size:13px;color:var(--ac2);font-weight:600}.loc.no{color:var(--wr);font-weight:500}
.meta{font-size:12px;color:var(--mu);margin-top:4px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:#fff;margin-right:6px}
.qty{position:absolute;top:10px;right:12px;font-weight:800;color:var(--ac)}
.ck{position:absolute;bottom:10px;right:12px}.ck input{width:18px;height:18px;accent-color:var(--ac2);cursor:pointer}
.tbl{width:100%;border-collapse:collapse;background:var(--pn);border-radius:14px;overflow:hidden}
.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--bd)}
.tbl th,.tbl td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--bd);font-size:13px;white-space:nowrap}
.tbl td:nth-child(2){white-space:normal;min-width:240px}.tbl tr{cursor:pointer}.tbl tbody tr:hover{background:var(--pn2)}.tbl th{background:var(--pn2);font-size:12px;text-transform:uppercase;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:60px 0;font-size:17px}
#bulk{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);transition:.25s;background:var(--pn);border:1px solid var(--ac2);box-shadow:var(--sh);border-radius:16px;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:96vw;z-index:20}
#bulk.show{transform:translate(-50%,0)}#bulk input{padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);width:130px}
.ov{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}.ov.show{display:flex}
.md{background:var(--pn);border-radius:20px;width:min(760px,100%);max-height:94vh;overflow:auto;padding:22px;box-shadow:var(--sh)}
.md h3{margin:0 0 14px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.fg .w{grid-column:1/-1}
.fg label{font-size:12px;color:var(--mu);display:block}.fg input,.fg textarea,.fg select{width:100%;margin-top:3px;padding:9px 11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
.fg input:focus,.fg textarea:focus{outline:none;border-color:var(--ac)}.fg h6{grid-column:1/-1;margin:8px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.acts .sp{margin-right:auto}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:99;opacity:0;pointer-events:none;transition:.25s}#toast.show{opacity:1}
#burger{display:none}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:fixed;z-index:30;top:0;bottom:0;left:0;width:290px;max-width:88vw;padding-top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-102%);transition:.25s;box-shadow:var(--sh)}aside.open{transform:none}#burger{display:inline-block}.fg{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style></head>
<body>
<div class="app">
<header>
 <button class="btn" id="burger" data-a="side">☰</button>
 <div class="logo">🔧 Krims<b>Kram</b></div>
 <div class="search"><input id="q" type="search" placeholder="Suchen: Name, Ort, Kiste, Tag, Notiz …  ( / )"></div>
 <select id="grp" title="Gruppieren nach"></select>
 <select id="srt" title="Sortieren"></select>
 <button class="btn" data-a="view" id="vw">☷ Liste</button>
 <button class="btn pri" data-a="new">＋ Neu</button>
 <button class="btn" data-a="backup">💾 Backup</button>
 <button class="btn" data-a="full" title="Vollbild">⛶</button>
 <button class="btn" data-a="theme" title="Hell/Dunkel">◐</button>
</header>
<aside id="side"></aside>
<main id="main"></main>
</div>
<div id="bulk"></div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div id="toast"></div>
<datalist id="dl_room"></datalist><datalist id="dl_place"></datalist><datalist id="dl_box"></datalist><datalist id="dl_obj"></datalist><datalist id="dl_cat"></datalist><datalist id="dl_src"></datalist><datalist id="dl_cond"><option>Neu</option><option>Gut</option><option>Gebraucht</option><option>Defekt</option><option>Verbraucht</option></datalist>
<script>
const DATA=/*DATA*/[];
const KEY='krimskram.v1',ICON={'Mikrocontroller':'🧠','Sensoren':'📡','Displays':'🖥️','Audio':'🔊','Funk & Netzwerk':'📶','Stromversorgung':'🔋','Relais & Schalter':'🎛️','Passive Bauteile':'🧲','Halbleiter':'💡','Platinen & Prototyping':'🧩','Kabel & Verbinder':'🔌','Gehäuse & Montage':'📦','PC & Speicher':'💾','Werkzeug':'🛠️','Kits & Sets':'🧰','Sonstiges':'🔩'};
const S={items:[],q:'',f:{},sort:'name',group:'room',view:'cards',theme:'',sel:new Set()};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>(+n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const NO='— nicht zugeordnet —';
const loc=i=>[i.room,i.place,i.box].filter(Boolean).join(' › ');
const G={none:null,room:i=>i.room||NO,place:i=>i.place?(i.room?i.room+' › ':'')+i.place:NO,box:i=>i.box?loc(i):NO,obj:i=>i.obj||NO,cat:i=>i.cat||'Sonstiges',src:i=>i.src||'?',year:i=>(i.date||'').slice(0,4)||'?'};
const GL={none:'Keine Gruppen',room:'Nach Raum',place:'Nach Ort / Schrank',box:'Nach Kiste / Fach',obj:'Nach Objekt / Projekt',cat:'Nach Kategorie',src:'Nach Quelle',year:'Nach Kaufjahr'};
const SL={name:'Name A–Z',date:'Neueste zuerst',dateA:'Älteste zuerst',price:'Preis ↓',qty:'Menge ↓',loc:'Standort'};
const SF={name:(a,b)=>a.name.localeCompare(b.name,'de'),date:(a,b)=>(b.date||'').localeCompare(a.date||''),dateA:(a,b)=>(a.date||'').localeCompare(b.date||''),price:(a,b)=>b.price-a.price,qty:(a,b)=>b.qty-a.qty,loc:(a,b)=>loc(a).localeCompare(loc(b),'de')||a.name.localeCompare(b.name,'de')};
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.items)){S.items=j.items;Object.assign(S,j.prefs||{});return}}catch(e){}
 S.items=DATA.map(d=>({room:'',place:'',box:'',obj:'',cond:'Gut',link:'',note:'',tags:'',...d}))}
function save(){try{localStorage.setItem(KEY,JSON.stringify({items:S.items,prefs:{sort:S.sort,group:S.group,view:S.view,theme:S.theme}}))}catch(e){toast('Browser-Speicher nicht verfügbar – bitte Backup kopieren')}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2400)}
function match(i){const f=S.f;
 for(const k of['room','place','box','cat','src','obj'])if(f[k]!==undefined&&(i[k]||'')!==f[k])return false;
 if(f.unplaced&&i.room)return false;
 if(S.q){const h=[i.name,i.full,i.cat,i.room,i.place,i.box,i.obj,i.tags,i.note,i.seller,i.src].join(' ').toLowerCase();
  return S.q.toLowerCase().split(/\s+/).every(w=>h.includes(w))}
 return true}
const list=()=>S.items.filter(match).sort(SF[S.sort]);
const uniq=k=>[...new Set(S.items.map(i=>i[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
function counts(k,arr=S.items){const m=new Map();arr.forEach(i=>{const v=i[k];if(v)m.set(v,(m.get(v)||0)+1)});return[...m].sort((a,b)=>a[0].localeCompare(b[0],'de'))}
const fj=o=>esc(JSON.stringify(o));
const isOn=o=>JSON.stringify(o)===JSON.stringify(S.f);
function rowH(label,n,o,cls=''){return`<div class="row ${cls} ${isOn(o)?'on':''}" data-a="filt" data-f="${fj(o)}"><span>${esc(label)}</span><i>${n}</i></div>`}
function renderSide(){
 const it=S.items,un=it.filter(i=>!i.room).length;
 let h=`<div class="stats"><div class="stat"><b>${it.length}</b><span>Artikel</span></div><div class="stat"><b>${it.reduce((a,i)=>a+(+i.qty||0),0).toLocaleString('de-DE')}</b><span>Stück gesamt</span></div><div class="stat"><b>${eur(it.reduce((a,i)=>a+(+i.price||0),0))}</b><span>Einkaufswert</span></div><div class="stat w"><b>${un}</b><span>noch einzusortieren</span></div></div>`;
 h+=rowH('📚 Alles',it.length,{})+rowH('📥 Nicht einsortiert',un,{unplaced:true});
 h+='<h5>Räume › Orte › Kisten</h5>';
 const rooms=counts('room');
 if(!rooms.length)h+='<div class="meta" style="padding:4px 10px">Noch keine Räume – Artikel anklicken oder auswählen und zuweisen.</div>';
 rooms.forEach(([r,n])=>{h+=rowH('🏠 '+r,n,{room:r});
  counts('place',it.filter(i=>i.room===r)).forEach(([p,m])=>{h+=rowH('🗄️ '+p,m,{room:r,place:p},'l1');
   counts('box',it.filter(i=>i.room===r&&i.place===p)).forEach(([b,k])=>h+=rowH('📦 '+b,k,{room:r,place:p,box:b},'l2'))})});
 h+='<h5>Objekte / Projekte</h5>';counts('obj').forEach(([v,n])=>h+=rowH('🎯 '+v,n,{obj:v}));
 h+='<h5>Kategorien</h5>';counts('cat').forEach(([v,n])=>h+=rowH((ICON[v]||'🔩')+' '+v,n,{cat:v}));
 h+='<h5>Quelle</h5>';counts('src').forEach(([v,n])=>h+=rowH('🛒 '+v,n,{src:v}));
 $('#side').innerHTML=h}
const card=i=>`<article class="card ${S.sel.has(i.id)?'sel':''}" data-a="open" data-id="${i.id}"><div class="ic">${ICON[i.cat]||'🔩'}</div><div class="bd"><h4>${esc(i.name)}</h4>${i.room?`<div class="loc">📍 ${esc(loc(i))}${i.obj?' · 🎯 '+esc(i.obj):''}</div>`:`<div class="loc no">📥 nicht einsortiert${i.obj?' · 🎯 '+esc(i.obj):''}</div>`}<div class="meta"><span class="badge">${esc(i.cat)}</span>${esc(i.src)} · ${i.date?new Date(i.date).toLocaleDateString('de-DE'):'–'} · ${eur(i.price)}</div>${i.tags?`<div class="meta">${i.tags.split(',').map(t=>`<span class="chip">#${esc(t.trim())}</span>`).join('')}</div>`:''}</div><div class="qty">${i.qty}×</div><label class="ck" data-a="sel" data-id="${i.id}"><input type="checkbox" ${S.sel.has(i.id)?'checked':''}></label></article>`;
const tbl=L=>`<div class="tw"><table class="tbl"><thead><tr><th></th><th>Artikel</th><th>Menge</th><th>Kategorie</th><th>Standort</th><th>Objekt</th><th>Quelle</th><th>Datum</th><th>Preis</th></tr></thead><tbody>${L.map(i=>`<tr data-a="open" data-id="${i.id}"><td data-a="sel" data-id="${i.id}"><input type="checkbox" ${S.sel.has(i.id)?'checked':''}></td><td>${esc(i.name)}</td><td>${i.qty}</td><td>${esc(i.cat)}</td><td>${esc(loc(i))||'<span style="color:var(--wr)">–</span>'}</td><td>${esc(i.obj)}</td><td>${esc(i.src)}</td><td>${i.date||''}</td><td>${eur(i.price)}</td></tr>`).join('')}</tbody></table></div>`;
function renderMain(){
 const L=list(),gk=G[S.group],gr=new Map();
 L.forEach(i=>{const k=gk?gk(i):'';(gr.get(k)||gr.set(k,[]).get(k)).push(i)});
 const keys=[...gr.keys()].sort((a,b)=>a===NO?1:b===NO?-1:S.group==='year'?b.localeCompare(a):a.localeCompare(b,'de'));
 let h='';
 if(!L.length)h='<div class="empty">🔍 Nichts gefunden.<br><small>Filter oder Suche anpassen – oder einen neuen Artikel anlegen.</small></div>';
 keys.forEach(k=>{const A=gr.get(k);
  if(gk)h+=`<h3 class="gh">${esc(k)} <small>${A.length} Artikel · ${A.reduce((a,i)=>a+(+i.qty||0),0)} Stück</small></h3>`;
  h+=S.view==='cards'?`<div class="grid">${A.map(card).join('')}</div>`:tbl(A)});
 if(Object.keys(S.f).length||S.q)h=`<div style="margin-bottom:12px"><b>${L.length}</b> Treffer ${S.q?`für „${esc(S.q)}“ `:''}<button class="btn" data-a="reset" style="padding:4px 10px;margin-left:8px">✕ Filter zurücksetzen</button></div>`+h;
 $('#main').innerHTML=h;$('#vw').textContent=S.view==='cards'?'☷ Liste':'▦ Karten'}
function renderBulk(){const b=$('#bulk'),n=S.sel.size;b.classList.toggle('show',n>0);if(!n)return;
 b.innerHTML=`<b>${n} gewählt</b><input id="b_room" list="dl_room" placeholder="Raum"><input id="b_place" list="dl_place" placeholder="Ort / Schrank"><input id="b_box" list="dl_box" placeholder="Kiste / Fach"><input id="b_obj" list="dl_obj" placeholder="Objekt"><input id="b_cat" list="dl_cat" placeholder="Kategorie"><button class="btn pri" data-a="bulk">Zuweisen</button><button class="btn" data-a="selall">Alle sichtbaren</button><button class="btn" data-a="selnone">✕</button>`}
function lists(){const f=(id,k)=>$('#'+id).innerHTML=uniq(k).map(v=>`<option value="${esc(v)}">`).join('');
 f('dl_room','room');f('dl_place','place');f('dl_box','box');f('dl_obj','obj');f('dl_cat','cat');f('dl_src','src');
 $('#dl_cat').innerHTML+=Object.keys(ICON).filter(c=>!uniq('cat').includes(c)).map(c=>`<option value="${c}">`).join('')}
function render(){lists();renderSide();renderMain();renderBulk()}
const FIELDS=[['h','Was ist es?'],['name','Bezeichnung','w'],['qty','Menge','number'],['cat','Kategorie','list:dl_cat'],['h','Wo liegt es?'],['room','Raum','list:dl_room'],['place','Ort / Schrank / Regal','list:dl_place'],['box','Kiste / Fach / Schublade','list:dl_box'],['obj','Objekt / Projekt','list:dl_obj'],['h','Details'],['cond','Zustand','list:dl_cond'],['tags','Tags (Komma getrennt)'],['src','Gekauft bei','list:dl_src'],['seller','Verkäufer / Hersteller'],['date','Kaufdatum','date'],['price','Preis gesamt (€)','number'],['unit','Stückpreis (€)','number'],['link','Link / Datenblatt'],['full','Original-Beschreibung','w ta'],['note','Notizen','w ta']];
function edit(id){const n=!id,i=n?{id:Date.now(),name:'',qty:1,cat:'Sonstiges',room:S.f.room||'',place:S.f.place||'',box:S.f.box||'',obj:'',cond:'Neu',tags:'',src:'',seller:'',date:new Date().toISOString().slice(0,10),price:0,unit:0,link:'',full:'',note:''}:S.items.find(x=>x.id===id);if(!i)return;
 let h=`<h3>${n?'＋ Neuer Artikel':'✏️ Artikel bearbeiten'}</h3><div class="fg">`;
 FIELDS.forEach(([k,l,t=''])=>{if(k==='h'){h+=`<h6>${l}</h6>`;return}
  const w=t.includes('w')?'w':'';
  if(t.includes('ta'))h+=`<div class="${w}"><label>${l}<textarea id="e_${k}" rows="3">${esc(i[k])}</textarea></label></div>`;
  else{const ty=t.startsWith('number')?'number" step="any':t==='date'?'date':'text';const ls=t.startsWith('list:')?` list="${t.slice(5)}"`:'';
   h+=`<div class="${w}"><label>${l}<input id="e_${k}" type="${ty}"${ls} value="${esc(i[k])}"></label></div>`}});
 h+=`</div><div class="acts">${n?'':`<button class="btn dan sp" data-a="del" data-id="${i.id}">🗑 Löschen</button><button class="btn" data-a="dup" data-id="${i.id}">⎘ Duplizieren</button>`}<button class="btn" data-a="close">Abbrechen</button><button class="btn pri" data-a="saveit" data-id="${i.id}" data-new="${n?1:0}">Speichern</button></div>`;
 $('#md').innerHTML=h;$('#ov').classList.add('show');setTimeout(()=>$('#e_name').focus(),30)}
function saveItem(id,isNew){const o={id};FIELDS.forEach(([k,,t=''])=>{if(k==='h')return;const v=$('#e_'+k).value.trim();o[k]=['qty','price','unit'].includes(k)?(+v||0):v});
 if(!o.name){toast('Bitte eine Bezeichnung eingeben');return}
 o.qty=o.qty||1;if(!o.unit&&o.price)o.unit=+(o.price/o.qty).toFixed(4);
 if(isNew)S.items.unshift(o);else{const x=S.items.findIndex(i=>i.id===id);S.items[x]=o}
 save();closeM();render();toast('Gespeichert ✓')}
const closeM=()=>$('#ov').classList.remove('show');
function backup(){const j=JSON.stringify(S.items);
 $('#md').innerHTML=`<h3>💾 Backup &amp; Import</h3><p class="meta">Deine Daten liegen im Speicher dieses Browsers. Kopiere regelmäßig das Backup in eine Textdatei. Zum Wiederherstellen (oder auf einem anderen Gerät) den Text hier einfügen und „Importieren“ klicken.</p><textarea id="bk" rows="10" style="width:100%;border-radius:10px;border:1px solid var(--bd);background:var(--bg);padding:10px;font:12px monospace">${esc(j)}</textarea><div class="acts"><button class="btn" data-a="csv">CSV in Zwischenablage</button><button class="btn" data-a="copy">JSON kopieren</button><button class="btn pri" data-a="imp">Importieren (ersetzt alles)</button><button class="btn" data-a="close">Schließen</button></div>`;$('#ov').classList.add('show')}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>toast('Kopiert ✓'),()=>fb())}catch(e){fb()}
 function fb(){const a=$('#bk');a.value=t;a.select();try{document.execCommand('copy');toast('Kopiert ✓')}catch(e){toast('Bitte Text manuell markieren und kopieren')}}}
function csv(){const K=['name','qty','cat','room','place','box','obj','cond','tags','src','seller','date','price','unit','link','note'];
 return[K.join(';')].concat(S.items.map(i=>K.map(k=>'"'+String(i[k]??'').replace(/"/g,'""')+'"').join(';'))).join('\n')}
const act={
 side(){$('#side').classList.toggle('open')},
 view(){S.view=S.view==='cards'?'list':'cards';save();renderMain()},
 new(){edit()},close:closeM,reset(){S.f={};S.q='';$('#q').value='';render()},
 theme(){const d=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#13151a';S.theme=d?'light':'dark';document.documentElement.dataset.theme=S.theme;save()},
 full(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast('Vollbild hier nicht erlaubt – F11 im Browser nutzen'))}catch(e){toast('Vollbild nicht verfügbar – F11 nutzen')}},
 backup,copy(){copy($('#bk').value)},csv(){copy(csv())},
 imp(){try{const a=JSON.parse($('#bk').value);if(!Array.isArray(a))throw 0;S.items=a;S.sel.clear();save();closeM();render();toast(a.length+' Artikel importiert')}catch(e){toast('Import fehlgeschlagen – ungültiger Text')}},
 saveit(el){saveItem(+el.dataset.id,el.dataset.new==='1')},
 del(el){if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Wirklich löschen?';return}S.items=S.items.filter(i=>i.id!==+el.dataset.id);save();closeM();render();toast('Gelöscht')},
 dup(el){const i=S.items.find(x=>x.id===+el.dataset.id);S.items.unshift({...i,id:Date.now(),name:i.name+' (Kopie)'});save();closeM();render();toast('Dupliziert')},
 filt(el){const o=JSON.parse(el.dataset.f);S.f=isOn(o)?{}:o;$('#side').classList.remove('open');render()},
 open(el){edit(+el.dataset.id)},
 sel(el){const id=+el.dataset.id;S.sel.has(id)?S.sel.delete(id):S.sel.add(id);render()},
 selall(){list().forEach(i=>S.sel.add(i.id));render()},selnone(){S.sel.clear();render()},
 bulk(){const v=k=>$('#b_'+k).value.trim(),u={};['room','place','box','obj','cat'].forEach(k=>{if(v(k))u[k]=v(k)});
  if(!Object.keys(u).length){toast('Bitte mindestens ein Feld ausfüllen');return}
  S.items.forEach(i=>{if(S.sel.has(i.id))Object.assign(i,u)});const n=S.sel.size;S.sel.clear();save();render();toast(n+' Artikel aktualisiert ✓')}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;
 if(el.dataset.a==='open'&&e.target.closest('[data-a="sel"]'))return;
 if(e.target.matches('input[type=checkbox]'))e.preventDefault();
 const f=act[el.dataset.a];if(f)f(el)});
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
$('#q').addEventListener('input',e=>{S.q=e.target.value;renderMain()});
$('#grp').innerHTML=Object.entries(GL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('#srt').innerHTML=Object.entries(SL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('#grp').onchange=e=>{S.group=e.target.value;save();renderMain()};$('#srt').onchange=e=>{S.sort=e.target.value;save();renderMain()};
load();if(S.theme)document.documentElement.dataset.theme=S.theme;$('#grp').value=S.group;$('#srt').value=S.sort;render();
</script></body></html>
