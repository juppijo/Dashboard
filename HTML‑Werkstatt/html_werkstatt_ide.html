<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaminia HTML-Werkstatt IDE v5</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JSZip & FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- Prism.js Syntax Highlighting & Dark Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zaminia: {
                            50: '#fdf2f2',
                            100: '#fde8e8',
                            400: '#f87171',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                            800: '#991b1b',
                            900: '#7f1d1d',
                            950: '#450a0a',
                        },
                        darkbase: {
                            900: '#0f0a0a',
                            800: '#181111',
                            700: '#261b1b',
                            600: '#3a2727',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #181111;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a2727;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #dc2626;
        }

        /* Editor Wrapper & Perfect Alignment Styles */
        .editor-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            background-color: #0f0a0a;
            overflow: hidden;
        }

        /* Line Numbers Gutter */
        #lineNumbersGutter {
            width: 50px;
            background-color: #120d0d;
            border-right: 1px solid #261b1b;
            color: #6b7280;
            font-family: 'Fira Code', Menlo, Monaco, Consolas, 'Courier New', monospace;
            font-size: 13px;
            line-height: 22px;
            padding: 16px 0;
            text-align: right;
            user-select: none;
            overflow: hidden;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .line-num {
            padding-right: 12px;
        }

        .editor-container {
            position: relative;
            flex: 1;
            height: 100%;
            overflow: hidden;
            background-color: #0f0a0a;
        }

        /* Both textarea and highlight display share IDENTICAL typography, padding, and box metrics */
        .editor-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 16px;
            margin: 0;
            border: 0;
            font-family: 'Fira Code', Menlo, Monaco, Consolas, 'Courier New', monospace;
            font-size: 13px;
            line-height: 22px;
            tab-size: 4;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow: auto;
            box-sizing: border-box;
        }

        #codeEditor {
            color: transparent;
            background: transparent;
            caret-color: #f87171;
            z-index: 2;
            resize: none;
            outline: none;
            /* Prevents automatic scrollbars from skewing alignment */
            overflow-x: auto;
            overflow-y: scroll;
        }

        #highlightDisplay {
            z-index: 1;
            pointer-events: none;
            background: #0f0a0a;
            overflow: hidden;
        }

        /* Resizer Splitter Bars */
        .resizer-x {
            width: 6px;
            cursor: col-resize;
            background: #181111;
            border-left: 1px solid #261b1b;
            border-right: 1px solid #261b1b;
            transition: background 0.2s;
            position: relative;
            z-index: 30;
            flex-shrink: 0;
        }
        .resizer-x:hover, .resizer-x.active {
            background: #ef4444;
        }

        .resizer-y {
            height: 6px;
            cursor: row-resize;
            background: #181111;
            border-top: 1px solid #261b1b;
            border-bottom: 1px solid #261b1b;
            transition: background 0.2s;
            position: relative;
            z-index: 30;
            flex-shrink: 0;
        }
        .resizer-y:hover, .resizer-y.active {
            background: #ef4444;
        }

        /* Prism Theme Custom Overrides for Zaminia Dark UI */
        code[class*="language-"], pre[class*="language-"] {
            font-family: 'Fira Code', Menlo, Monaco, Consolas, 'Courier New', monospace !important;
            font-size: 13px !important;
            line-height: 22px !important;
            text-shadow: none !important;
            background: transparent !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        .token.comment, .token.prolog, .token.doctype, .token.cdata { color: #7c7c7c; font-style: italic; }
        .token.punctuation { color: #a3a3a3; }
        .token.property, .token.tag, .token.boolean, .token.number, .token.constant, .token.symbol, .token.deleted { color: #f87171; }
        .token.selector, .token.attr-name, .token.string, .token.char, .token.builtin, .token.inserted { color: #34d399; }
        .token.operator, .token.entity, .token.url, .language-css .token.string, .style .token.string { color: #fbbf24; }
        .token.atrule, .token.attr-value, .token.keyword { color: #60a5fa; }
        .token.function, .token.class-name { color: #c084fc; }
        .token.regex, .token.important, .token.variable { color: #f472b6; }
    </style>
</head>
<body class="bg-darkbase-900 text-gray-100 h-screen w-screen overflow-hidden flex flex-col font-sans select-none">

    <!-- Top Navigation Bar -->
    <header class="bg-darkbase-800 border-b border-darkbase-700 h-14 flex items-center justify-between px-4 shrink-0 shadow-lg z-20">
        <div class="flex items-center space-x-3">
            <div class="bg-zaminia-700 text-white p-2 rounded-xl shadow-md shadow-zaminia-900/50 flex items-center justify-center w-9 h-9">
                <i class="fa-solid fa-code text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold tracking-wide text-sm md:text-base text-gray-100 flex items-center gap-2">
                    Zaminia Werkstatt <span class="text-xs bg-zaminia-900/60 text-zaminia-400 border border-zaminia-700/50 px-2 py-0.5 rounded-full font-mono">IDE v5.0 (Line Numbers & Gutter)</span>
                </h1>
            </div>
        </div>

        <div class="flex items-center space-x-2 md:space-x-3">
            <!-- Collapse Toggles -->
            <div class="hidden md:flex items-center space-x-1 bg-darkbase-900 p-1 rounded-lg border border-darkbase-700 text-xs mr-2">
                <button onclick="toggleSidebar()" id="btnToggleSidebar" title="Sidebar ein-/ausklappen" class="px-2 py-1 hover:bg-darkbase-700 rounded text-gray-300 transition flex items-center space-x-1">
                    <i class="fa-solid fa-folder-tree text-zaminia-400"></i>
                    <span>Dateien</span>
                </button>
                <button onclick="toggleConsolePane()" id="btnToggleConsole" title="Konsole ein-/ausklappen" class="px-2 py-1 hover:bg-darkbase-700 rounded text-gray-300 transition flex items-center space-x-1">
                    <i class="fa-solid fa-terminal text-amber-400"></i>
                    <span>Konsole</span>
                </button>
            </div>

            <button onclick="saveProjectToLocalStorage()" title="Projekt lokal speichern (Ctrl+S)" class="flex items-center space-x-1.5 px-3 py-1.5 bg-darkbase-700 hover:bg-darkbase-600 border border-darkbase-600 text-xs font-medium rounded-lg transition-all shadow-sm">
                <i class="fa-solid fa-floppy-disk text-zaminia-400"></i>
                <span class="hidden sm:inline">Speichern</span>
            </button>
            <button onclick="exportProjectZip()" title="Als ZIP herunterladen" class="flex items-center space-x-1.5 px-3 py-1.5 bg-darkbase-700 hover:bg-darkbase-600 border border-darkbase-600 text-xs font-medium rounded-lg transition-all shadow-sm">
                <i class="fa-solid fa-file-zipper text-emerald-400"></i>
                <span class="hidden sm:inline">Export ZIP</span>
            </button>
            <label title="Projekt importieren" class="cursor-pointer flex items-center space-x-1.5 px-3 py-1.5 bg-darkbase-700 hover:bg-darkbase-600 border border-darkbase-600 text-xs font-medium rounded-lg transition-all shadow-sm">
                <i class="fa-solid fa-folder-open text-amber-400"></i>
                <span class="hidden sm:inline">Importieren</span>
                <input type="file" id="importFile" onchange="importProject(event)" class="hidden" accept=".zip">
            </label>

            <div class="h-5 w-[1px] bg-darkbase-600 mx-1"></div>

            <button onclick="toggleLayout('split')" id="btnSplit" title="Geteilte Ansicht" class="p-2 bg-darkbase-600 text-zaminia-400 rounded-lg text-xs transition-all">
                <i class="fa-solid fa-columns"></i>
            </button>
            <button onclick="toggleLayout('code')" id="btnCodeOnly" title="Nur Code" class="p-2 bg-darkbase-700 hover:bg-darkbase-600 text-gray-300 rounded-lg text-xs transition-all">
                <i class="fa-solid fa-file-code"></i>
            </button>
            <button onclick="toggleLayout('preview')" id="btnPreviewOnly" title="Nur Vorschau" class="p-2 bg-darkbase-700 hover:bg-darkbase-600 text-gray-300 rounded-lg text-xs transition-all">
                <i class="fa-solid fa-eye"></i>
            </button>

            <div class="h-5 w-[1px] bg-darkbase-600 mx-1"></div>

            <button onclick="toggleFullScreen()" title="Vollbildmodus" class="flex items-center justify-center w-8 h-8 bg-zaminia-600 hover:bg-zaminia-700 text-white rounded-lg text-xs transition-all shadow-md shadow-zaminia-900/40">
                <i class="fa-solid fa-expand" id="fsIcon"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container with Resizable Panes -->
    <div class="flex-1 flex overflow-hidden relative" id="workspaceContainer">
        
        <!-- Sidebar: File Manager -->
        <div id="sidebar" class="w-64 bg-darkbase-800/90 border-r border-darkbase-700 flex flex-col shrink-0 select-none transition-all duration-150" style="width: 250px; min-width: 150px; max-width: 450px;">
            <div class="p-3 border-b border-darkbase-700 flex items-center justify-between text-xs font-semibold tracking-wider text-gray-400 uppercase">
                <span><i class="fa-solid fa-folder-tree mr-1.5 text-zaminia-500"></i> Dateien</span>
                <div class="flex items-center space-x-1">
                    <button onclick="openNewFileDialog()" title="Neue Datei" class="p-1.5 hover:bg-darkbase-600 text-gray-300 hover:text-white rounded transition">
                        <i class="fa-solid fa-file-circle-plus text-zaminia-400"></i>
                    </button>
                    <button onclick="openUploadFileDialog()" title="Datei hochladen" class="p-1.5 hover:bg-darkbase-600 text-gray-300 hover:text-white rounded transition">
                        <i class="fa-solid fa-upload"></i>
                    </button>
                    <input type="file" id="singleFileUpload" class="hidden" onchange="uploadSingleFile(event)">
                </div>
            </div>

            <div id="fileList" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Populated via JavaScript -->
            </div>

            <div class="p-3 border-t border-darkbase-700 bg-darkbase-900/50">
                <div class="text-[11px] text-gray-400 mb-2 font-medium">Schnellvorlage laden:</div>
                <div class="grid grid-cols-2 gap-1.5">
                    <button onclick="loadTemplate('landing')" class="px-2 py-1 bg-darkbase-700 hover:bg-zaminia-900/40 hover:border-zaminia-600 border border-darkbase-600 rounded text-xs text-left transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-globe text-zaminia-400"></i>
                        <span class="truncate">Landingpage</span>
                    </button>
                    <button onclick="loadTemplate('game')" class="px-2 py-1 bg-darkbase-700 hover:bg-zaminia-900/40 hover:border-zaminia-600 border border-darkbase-600 rounded text-xs text-left transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-gamepad text-emerald-400"></i>
                        <span class="truncate">Mini-Game</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Resizer: Sidebar <-> Center Editor -->
        <div class="resizer-x" id="resizerSidebar" title="Größe anpassen"></div>

        <!-- Center Column (Editor + Console vertically resizable) -->
        <div id="centerColumn" class="flex-1 flex flex-col overflow-hidden relative" style="min-width: 250px;">
            
            <!-- Editor Pane -->
            <div id="editorPane" class="flex-1 flex flex-col bg-darkbase-900 overflow-hidden relative" style="min-height: 150px;">
                <!-- Editor Top Toolbar & Tabs -->
                <div class="bg-darkbase-800 border-b border-darkbase-700 flex items-center justify-between shrink-0 h-10 px-2">
                    <div id="tabBar" class="flex items-center overflow-x-auto space-x-1 flex-1">
                        <!-- Tabs populated via JS -->
                    </div>

                    <!-- Color Picker & Quick Palette Toolbar -->
                    <div class="flex items-center space-x-2 pl-2 border-l border-darkbase-700">
                        <div class="flex items-center space-x-1 bg-darkbase-900 px-2 py-1 rounded-lg border border-darkbase-700">
                            <i class="fa-solid fa-palette text-xs text-zaminia-400" title="Text- / Farb-Werkzeug"></i>
                            <input type="color" id="colorPicker" value="#ef4444" onchange="insertColorCode(this.value)" class="w-5 h-5 bg-transparent cursor-pointer border-0 p-0 rounded" title="Farbe wählen">
                            <span id="colorHexText" class="text-[11px] font-mono text-gray-300">#ef4444</span>
                            <button onclick="insertColorCode(document.getElementById('colorPicker').value)" class="text-[10px] bg-zaminia-700 hover:bg-zaminia-600 text-white px-1.5 py-0.5 rounded transition ml-1">
                                Einfügen
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Code Editor Container with Line Numbers & Syntax Highlighting Overlay -->
                <div class="flex-1 relative flex flex-col overflow-hidden">
                    <div class="absolute top-2 right-4 z-10 bg-darkbase-800/80 backdrop-blur border border-darkbase-700 rounded-lg px-2.5 py-1 text-[11px] text-gray-400 flex items-center space-x-2 pointer-events-none shadow">
                        <span id="activeFileLang" class="font-mono text-zaminia-400 uppercase font-semibold">HTML</span>
                        <span class="text-darkbase-600">|</span>
                        <span id="cursorPosition">Ln 1, Col 1</span>
                    </div>

                    <div class="editor-wrapper">
                        <!-- Line Numbers Gutter -->
                        <div id="lineNumbersGutter">1</div>
                        
                        <!-- Textarea & Highlighting Overlay -->
                        <div class="editor-container">
                            <pre id="highlightDisplay" class="editor-layer"><code id="highlightCode" class="language-html"></code></pre>
                            <textarea id="codeEditor" 
                                class="editor-layer"
                                placeholder="Wähle eine Datei aus oder erstelle eine neue..."
                                oninput="handleCodeInput(event)"
                                onkeydown="handleKeyDown(event)"
                                onkeyup="updateCursorPosition()"
                                onclick="updateCursorPosition()"
                                onscroll="syncScroll()"
                                spellcheck="false"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Editor Status Footer -->
                <div class="bg-darkbase-800 border-t border-darkbase-700 px-3 py-1.5 text-xs text-gray-400 flex items-center justify-between shrink-0">
                    <div class="flex items-center space-x-3">
                        <span class="flex items-center space-x-1.5 text-emerald-400">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span id="statusMessage">Bereit</span>
                        </span>
                    </div>
                    <div class="flex items-center space-x-3 text-gray-400">
                        <button onclick="triggerRun()" class="hover:text-white flex items-center space-x-1 text-zaminia-400 hover:text-zaminia-300 font-medium">
                            <i class="fa-solid fa-play"></i>
                            <span>Vorschau aktualisieren</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Resizer: Editor <-> Console -->
            <div class="resizer-y" id="resizerConsole" title="Konsole vergrößern/verkleinern"></div>

            <!-- Integrated Console Viewer Panel -->
            <div id="consolePane" class="bg-darkbase-900 border-t border-darkbase-700 flex flex-col shrink-0 transition-all duration-150" style="height: 140px; min-height: 40px; max-height: 400px;">
                <div class="bg-darkbase-800 border-b border-darkbase-700 px-3 py-1.5 flex items-center justify-between text-xs text-gray-300 select-none">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-terminal text-amber-400"></i>
                        <span class="font-bold tracking-wide">Entwickler-Konsole</span>
                        <span id="consoleBadge" class="bg-darkbase-700 text-gray-400 px-1.5 py-0.2 rounded-full text-[10px] font-mono">0</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div class="flex items-center space-x-1 bg-darkbase-900 px-2 py-0.5 rounded border border-darkbase-700">
                            <label class="cursor-pointer text-[11px] text-gray-300 flex items-center space-x-1">
                                <input type="checkbox" id="filterLog" checked onchange="renderConsoleLogs()" class="accent-zaminia-600">
                                <span class="text-blue-400">Log</span>
                            </label>
                            <span class="text-darkbase-600">|</span>
                            <label class="cursor-pointer text-[11px] text-gray-300 flex items-center space-x-1">
                                <input type="checkbox" id="filterWarn" checked onchange="renderConsoleLogs()" class="accent-zaminia-600">
                                <span class="text-amber-400">Warn</span>
                            </label>
                            <span class="text-darkbase-600">|</span>
                            <label class="cursor-pointer text-[11px] text-gray-300 flex items-center space-x-1">
                                <input type="checkbox" id="filterError" checked onchange="renderConsoleLogs()" class="accent-zaminia-600">
                                <span class="text-red-400">Error</span>
                            </label>
                        </div>
                        <button onclick="clearConsoleLogs()" title="Konsole leeren" class="p-1 hover:bg-darkbase-700 rounded text-gray-400 hover:text-white transition">
                            <i class="fa-solid fa-ban"></i>
                        </button>
                        <button onclick="toggleConsolePane()" title="Konsole minimieren/maximieren" class="p-1 hover:bg-darkbase-700 rounded text-gray-400 hover:text-white transition">
                            <i class="fa-solid fa-chevron-down" id="consoleToggleIcon"></i>
                        </button>
                    </div>
                </div>
                <div id="consoleOutputList" class="flex-1 overflow-y-auto p-2 font-mono text-xs space-y-1 bg-[#0b0707] select-text">
                    <!-- Logs populated via JS -->
                </div>
            </div>

        </div>

        <!-- Resizer: Center Column <-> Preview Pane -->
        <div class="resizer-x" id="resizerPreview" title="Größe anpassen"></div>

        <!-- Right Preview Pane -->
        <div id="previewPane" class="flex flex-col bg-white border-l border-darkbase-700 shrink-0 relative transition-all duration-150" style="width: 50%; min-width: 200px; max-width: 80%;">
            <div class="bg-darkbase-800 border-b border-darkbase-700 h-10 px-3 flex items-center justify-between shrink-0 text-xs text-gray-300">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-desktop text-zaminia-400"></i>
                    <span class="font-semibold">Live-Vorschau mit verknüpften Dateien</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="triggerRun()" title="Aktualisieren" class="p-1.5 hover:bg-darkbase-700 rounded transition text-gray-300 hover:text-white">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                    <button onclick="openPreviewInNewTab()" title="In neuem Tab öffnen" class="p-1.5 hover:bg-darkbase-700 rounded transition text-gray-300 hover:text-white">
                        <i class="fa-solid fa-external-link-alt"></i>
                    </button>
                </div>
            </div>
            <iframe id="previewFrame" class="w-full flex-1 border-0 bg-white" sandbox="allow-scripts allow-modals allow-same-origin allow-forms"></iframe>
        </div>

    </div>

    <!-- Modal Overlays -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="newFileModal" class="bg-darkbase-800 border border-darkbase-700 rounded-2xl w-full max-w-md p-6 shadow-2xl hidden">
            <h3 class="text-lg font-bold text-gray-100 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-file-circle-plus text-zaminia-500"></i> Neue Datei erstellen
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Dateiname (z.B. style.css, script.js)</label>
                    <input type="text" id="newFileNameInput" class="w-full bg-darkbase-900 border border-darkbase-700 rounded-lg px-3 py-2 text-sm text-gray-200 outline-none focus:border-zaminia-500 transition" placeholder="dateiname.html">
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button onclick="closeModal()" class="px-4 py-2 bg-darkbase-700 hover:bg-darkbase-600 rounded-lg text-sm text-gray-300 transition">Abbrechen</button>
                    <button onclick="confirmCreateFile()" class="px-4 py-2 bg-zaminia-600 hover:bg-zaminia-700 text-white rounded-lg text-sm font-medium transition shadow-lg shadow-zaminia-900/50">Erstellen</button>
                </div>
            </div>
        </div>

        <div id="messageModal" class="bg-darkbase-800 border border-darkbase-700 rounded-2xl w-full max-w-sm p-6 shadow-2xl hidden">
            <h3 id="modalTitle" class="text-lg font-bold text-gray-100 mb-2">Hinweis</h3>
            <p id="modalText" class="text-sm text-gray-300 mb-6"></p>
            <div class="flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2 bg-zaminia-600 hover:bg-zaminia-700 text-white rounded-lg text-sm font-medium transition shadow-md">OK</button>
            </div>
        </div>
    </div>

    <script>
        const defaultFiles = {
            "index.html": {
                content: `<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaminia Web-Projekt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="container">
    <div class="card">
        <h1>✨ Hallo aus style.css!</h1>
        <p>Diese Vorschau bindet Stylesheets ein und fängt Konsolen-Logs & Fehler automatisch ab.</p>
        <button onclick="triggerAction()">Klick mich für Logs</button>
    </div>
    <script src="script.js"><\\/script>
</body>
</html>`,
                language: "html"
            },
            "style.css": {
                content: `body.container {
    background: linear-gradient(135deg, #0f172a, #1e1b4b);
    color: #f8fafc;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.card {
    background: rgba(30, 41, 59, 0.85);
    padding: 40px;

        // --- Console Management ---

            list.innerHTML = "";
            let countFiltered = 0;

            consoleLogs.forEach(log => {
                if (log.type === 'log' && !showLog) return;

                if (log.type === 'error' && !showError) return;

                countFiltered++;
                const item = document.createElement("div");
                item.className = "flex items-start space-x-2 py-0.5 border-b border-darkbase-800 font-mono text-[11px] leading-relaxed";

                let icon = '<i class="fa-solid fa-info-circle text-blue-400 mt-0.5"></i>';

                    icon = '<i class="fa-solid fa-triangle-exclamation text-amber-400 mt-0.5"></i>';
                    colorClass = "text-amber-300";
                    bgClass = "bg-amber-950/25";
                } else if (log.type === 'error') {
                    icon = '<i class="fa-solid fa-circle-xmark text-red-400 mt-0.5"></i>';
                    colorClass = "text-red-300";
                    bgClass = "bg-red-950/30";

                item.className += ` ${bgClass}`;
                item.innerHTML = `
                    <span class="text-gray-500 shrink-0 select-none">[${log.time}]</span>
                    <span class="shrink-0">${icon}</span>
                    <span class="${colorClass} whitespace-pre-wrap break-all flex-1">${escapeHtml(log.message)}</span>
                `;
                list.appendChild(item);

            if (countFiltered === 0) {
                list.innerHTML = `<div class="text-gray-500 text-center py-4 italic">Keine Konsoleneinträge vorhanden.</div>`;
            } else {
                list.scrollTop = list.scrollHeight;

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Global functions exposed to iframe sandbox via parent hook
        window.parentConsoleLog = function(...args) {

        // --- Project & File Management ---

        function updateHighlighting() {
            const editor = document.getElementById("codeEditor");
            const highlightCode = document.getElementById("highlightCode");
            const lang = projectFiles[activeFile]?.language || 'html';

            let prismLang = Prism.languages.markup;
            let langClass = "language-html";

            if (lang === 'css') {
                prismLang = Prism.languages.css;
                langClass = "language-css";
            } else if (lang === 'javascript' || lang === 'js') {
                prismLang = Prism.languages.javascript;
                langClass = "language-javascript";
            }

            highlightCode.className = langClass;
            
            let text = editor.value;
            if (text.endsWith("\n")) {
                text += " ";
            }
            
            highlightCode.innerHTML = Prism.highlight(text, prismLang, lang);
            syncScroll();
        }

        function updateLineNumbers() {
            const editor = document.getElementById("codeEditor");
            const gutter = document.getElementById("lineNumbersGutter");
            const linesCount = editor.value.split('\n').length;
            
            let html = "";
            for (let i = 1; i <= linesCount; i++) {
                html += `<div>${i}</div>`;
            }
            gutter.innerHTML = html;
        }

        function syncScroll() {
            const editor = document.getElementById("codeEditor");
            const highlightDisplay = document.getElementById("highlightDisplay");
            const gutter = document.getElementById("lineNumbersGutter");

            highlightDisplay.scrollTop = editor.scrollTop;

            editor.value = text.substring(0, start) + hex + text.substring(end);
            editor.selectionStart = editor.selectionEnd = start + hex.length;
            
            handleCodeInput({ target: editor });

        function closeTab(filename, event) {

                openTabs = [Object.keys(projectFiles)[0]];

            const ext = name.split('.').pop().toLowerCase();
            let lang = "text";
            if(ext === 'html') lang = "html";
            if(ext === 'css') lang = "css";
            if(ext === 'js') lang = "javascript";

            projectFiles[name] = { content: "", language: lang };
            closeModal();
            openFile(name);
            renderFileList();
            saveProjectToLocalStorage();

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const name = file.name;
                const ext = name.split('.').pop().toLowerCase();
                let lang = "text";
                if(ext === 'html') lang = "html";
                if(ext === 'css') lang = "css";
                if(ext === 'js') lang = "javascript";

                projectFiles[name] = { content, language: lang };
                openFile(name);

        function triggerRun() {
            const frame = document.getElementById("previewFrame");
            let htmlContent = "";

            if (projectFiles["index.html"]) {
                htmlContent = projectFiles["index.html"].content;

                const firstHtml = Object.keys(projectFiles).find(k => k.endsWith('.html'));
                if (firstHtml) {
                    htmlContent = projectFiles[firstHtml].content;

                    htmlContent = "<html><body style='font-family:sans-serif;padding:20px;text-align:center;'><h2>Keine index.html gefunden</h2><p>Bitte erstellen Sie eine HTML-Datei.</p></body></html>";
                }
            }

            const blobUrls = {};
            Object.keys(projectFiles).forEach(filename => {
                const file = projectFiles[filename];
                let mime = "text/plain";
                if(filename.endsWith('.html')) mime = "text/html";
                if(filename.endsWith('.css')) mime = "text/css";
                if(filename.endsWith('.js')) mime = "application/javascript";
                if(filename.endsWith('.png')) mime = "image/png";
                if(filename.endsWith('.jpg') || filename.endsWith('.jpeg')) mime = "image/jpeg";

                const blob = new Blob([file.content], { type: mime });
                blobUrls[filename] = URL.createObjectURL(blob);
            });

            let processedHtml = htmlContent;
            Object.keys(projectFiles).forEach(filename => {
                const url = blobUrls[filename];
                processedHtml = processedHtml.split(`"${filename}"`).join(`"${url}"`);
                processedHtml = processedHtml.split(`'${filename}'`).join(`'${url}'`);
                processedHtml = processedHtml.split(`"./${filename}"`).join(`"${url}"`);
                processedHtml = processedHtml.split(`'./${filename}'`).join(`'${url}'`);
            });

            // Injection script to intercept console and errors in iframe
            const interceptionScript = `
                <script>
                    (function() {
                        const originalLog = console.log;
                        const originalWarn = console.warn;
                        const originalError = console.error;

                        console.log = function(...args) {
                            originalLog.apply(console, args);
                            window.parent.parentConsoleLog(...args);
                        };
                        console.warn = function(...args) {
                            originalWarn.apply(console, args);
                            window.parent.parentConsoleWarn(...args);
                        };
                        console.error = function(...args) {
                            originalError.apply(console, args);
                            window.parent.parentConsoleError(...args);
                        };

                        window.onerror = function(msg, url, line, col, error) {
                            window.parent.parentWindowError(msg, url, line);
                            return false;
                        };

                        window.alert = function(msg) {
                            window.parent.windowAlert(msg);
                        };
                    })();
                <\/script>
            `;

            if (processedHtml.includes('<head>')) {
                processedHtml = processedHtml.replace('<head>', '<head>' + interceptionScript);
            } else if (processedHtml.includes('<html>')) {
                processedHtml = processedHtml.replace('<html>', '<html><head>' + interceptionScript + '</head>');
            } else {
                processedHtml = interceptionScript + processedHtml;
            }

            const finalBlob = new Blob([processedHtml], { type: "text/html" });
            frame.src = URL.createObjectURL(finalBlob);
            
            document.getElementById("statusMessage").innerText = "Vorschau aktualisiert";
            setTimeout(() => {
                document.getElementById("statusMessage").innerText = "Bereit";
            }, 2000);
        }

        function openPreviewInNewTab() {

        function exportProjectZip() {

        function importProject(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.name.endsWith('.zip')) {
                JSZip.loadAsync(file).then(function(zip) {
                    projectFiles = {};
                    let promises = [];
                    zip.forEach(function (relativePath, zipEntry) {
                        if (!zipEntry.dir && !relativePath.startsWith('__MACOSX')) {
                            const p = zipEntry.async("string").then(function(content) {
                                const ext = relativePath.split('.').pop().toLowerCase();
                                let lang = "text";
                                if(ext === 'html') lang = "html";
                                if(ext === 'css') lang = "css";
                                if(ext === 'js') lang = "javascript";
                                projectFiles[relativePath] = { content, language: lang };
                            });
                            promises.push(p);
                        }
                    });
                    Promise.all(promises).then(() => {
                        openTabs = Object.keys(projectFiles);
                        activeFile = openTabs[0] || "index.html";
                        openFile(activeFile);
                        renderFileList();
                        renderTabs();
                        saveProjectToLocalStorage();
                        showNotification("ZIP Projekt erfolgreich importiert!");
                    });
                });
            }
        }

        function toggleLayout(mode) {
            const editorPane = document.getElementById("editorPane");
            const previewPane = document.getElementById("previewPane");
            const resizerPreview = document.getElementById("resizerPreview");
            
            document.getElementById("btnSplit").className = "p-2 bg-darkbase-700 hover:bg-darkbase-600 text-gray-300 rounded-lg text-xs transition-all";
            document.getElementById("btnCodeOnly").className = "p-2 bg-darkbase-700 hover:bg-darkbase-600 text-gray-300 rounded-lg text-xs transition-all";
            document.getElementById("btnPreviewOnly").className = "p-2 bg-darkbase-700 hover:bg-darkbase-600 text-gray-300 rounded-lg text-xs transition-all";

            if (mode === 'split') {
                document.getElementById("btnSplit").className = "p-2 bg-darkbase-600 text-zaminia-400 rounded-lg text-xs transition-all";
                document.getElementById("centerColumn").style.display = "flex";
                previewPane.style.display = "flex";
                previewPane.style.width = "50%";
                resizerPreview.style.display = "block";
            } else if (mode === 'code') {
                document.getElementById("btnCodeOnly").className = "p-2 bg-darkbase-600 text-zaminia-400 rounded-lg text-xs transition-all";
                document.getElementById("centerColumn").style.display = "flex";
                previewPane.style.display = "none";
                resizerPreview.style.display = "none";
            } else if (mode === 'preview') {
                document.getElementById("btnPreviewOnly").className = "p-2 bg-darkbase-600 text-zaminia-400 rounded-lg text-xs transition-all";
                document.getElementById("centerColumn").style.display = "none";
                previewPane.style.display = "flex";
                previewPane.style.width = "100%";
                resizerPreview.style.display = "none";
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alertCustom(`Fehler beim Vollbildmodus: ${err.message}`);
                });
                document.getElementById("fsIcon").className = "fa-solid fa-compress";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                document.getElementById("fsIcon").className = "fa-solid fa-expand";
            }
        }

        function alertCustom(message) {
            document.getElementById("modalOverlay").classList.remove("hidden");
            document.getElementById("newFileModal").classList.add("hidden");
            document.getElementById("messageModal").classList.remove("hidden");
            document.getElementById("modalTitle").innerText = "Meldung";
            document.getElementById("modalText").innerText = message;
        }

        function showNotification(text) {
            const status = document.getElementById("statusMessage");
            status.innerText = text;
            setTimeout(() => {
                status.innerText = "Bereit";
            }, 3000);
        }
    </script>
</body>
</html>
