<!DOCTYPE html>
<html lang="de" data-theme="gold">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Werkstatt – HTML-Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#0e0d0b;--bg2:#15130f;--bg3:#1e1b15;--line:#2f2a1f;--tx:#e8e0cc;--mut:#8d836b;--gold:#d4a937;--gold2:#f0c75a;--t:#e8806a;--a:#d4a937;--s:#98c379;--k:#c792ea;--n:#e0a96d;--c:#6e6853;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[data-theme=hell]{--bg:#faf7ef;--bg2:#f1ecdd;--bg3:#e7e0ca;--line:#d3c9ab;--tx:#2b2616;--mut:#7b7357;--gold:#a67c00;--gold2:#7d5b00;--t:#c0392b;--a:#9a6b00;--s:#3a7d2c;--k:#8e44ad;--n:#b5651d;--c:#9a927a}
[data-theme=blau]{--bg:#0a0f1e;--bg2:#0f1629;--bg3:#16203a;--line:#243053;--tx:#dce6ff;--mut:#7f90b8;--gold:#5aa9ff;--gold2:#8cc4ff;--t:#ff7b8a;--a:#7fd1ff;--s:#9be28a;--k:#c3a6ff;--n:#ffc27a;--c:#5d6e95}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px Barlow,system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:thin}
.logo{font:26px 'Bebas Neue',sans-serif;letter-spacing:2px;color:var(--tx);margin-right:8px;white-space:nowrap}.logo span{color:var(--gold)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}.sp{flex:1}
button{font:inherit;color:var(--tx);background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--gold);color:var(--gold2)}
button.on,button.pri{background:var(--gold);color:#111;border-color:var(--gold);font-weight:600}
button.pri:hover{color:#111;filter:brightness(1.1)}
#main{flex:1;display:flex;min-height:0}#main.v{flex-direction:column}
#side{width:210px;flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side.off{display:none}
.sh{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font:17px 'Bebas Neue';letter-spacing:1.5px;color:var(--gold)}
.sh button{padding:1px 8px}
#list{list-style:none;margin:0;padding:0 6px;overflow:auto;flex:1}
#list li{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--mut)}
#list li:hover{background:var(--bg3);color:var(--tx)}#list li.a{background:var(--bg3);color:var(--gold2);box-shadow:inset 2px 0 var(--gold)}
#list .ac{display:none;gap:2px}#list li:hover .ac{display:flex}#list .ac button{padding:0 5px;border:0;background:none}
.hint{padding:8px 10px;font-size:12px;color:var(--mut);border-top:1px solid var(--line)}
#ed,#pv{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1 1 0}
#tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:thin}
.tab{display:flex;gap:8px;align-items:center;padding:7px 12px;border-right:1px solid var(--line);color:var(--mut);cursor:pointer;white-space:nowrap}
.tab.a{background:var(--bg);color:var(--gold2);box-shadow:inset 0 2px var(--gold)}.tab b{font-weight:400;opacity:.6}.tab b:hover{color:var(--t);opacity:1}
#ew{flex:1;position:relative;min-height:0;font:14px/22px 'JetBrains Mono',ui-monospace,monospace;font-variant-ligatures:none;font-kerning:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden}
#ln,#hl,#mk,#ta{position:absolute;top:0;bottom:0;margin:0;padding:10px 0;font:inherit;font-variant-ligatures:none;font-kerning:none;tab-size:2;white-space:pre;overflow-wrap:normal}
#ln{left:0;width:46px;text-align:right;padding-right:10px;color:var(--mut);background:var(--bg2);overflow:hidden;border-right:1px solid var(--line);opacity:.8}
#hl,#mk,#ta{left:46px;right:0;padding-left:12px;padding-right:12px;padding-bottom:30px;overflow:auto;word-wrap:normal;letter-spacing:0}
#hl,#mk{padding-right:48px;padding-bottom:64px}
#hl{overflow:hidden;color:var(--tx);pointer-events:none}
#mk{overflow:hidden;color:transparent;pointer-events:none}
#mk mark{background:color-mix(in srgb,var(--gold) 28%,transparent);color:transparent;border-radius:2px}
#mk mark.cur{background:color-mix(in srgb,var(--gold) 70%,transparent);outline:1px solid var(--gold2)}
#sb{display:flex;flex-direction:column;gap:5px;padding:6px 10px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
.sr1{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
#sb input{flex:1;min-width:120px;max-width:340px;padding:5px 8px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;font:inherit}
#sb input:focus{border-color:var(--gold);outline:0}
#sb button{padding:3px 9px}#qc{color:var(--mut);font-size:12px;min-width:60px}
#sr{max-height:190px;overflow:auto;background:var(--bg2);border-top:1px solid var(--line);font:12px/1.6 'JetBrains Mono',monospace;flex:none}
#sr .fh{padding:3px 12px;color:var(--gold);background:var(--bg3);font-family:Barlow,sans-serif;font-weight:600;position:sticky;top:0}
#sr .hit{padding:1px 12px;cursor:pointer;white-space:pre;overflow:hidden;text-overflow:ellipsis}
#sr .hit:hover{background:var(--bg3)}#sr .hit span{display:inline-block;width:38px;color:var(--mut)}
#sr mark{background:color-mix(in srgb,var(--gold) 45%,transparent);color:inherit}
#sb[hidden],#sr[hidden]{display:none}
#ta{background:transparent;color:transparent;caret-color:var(--gold2);border:0;outline:0;resize:none;-webkit-appearance:none;appearance:none;border-radius:0}
#ta::selection{background:color-mix(in srgb,var(--gold) 35%,transparent)}
#hl i{font-style:normal}.t{color:var(--t)}.a{color:var(--a)}.s{color:var(--s)}.k{color:var(--k)}.n{color:var(--n)}.c{color:var(--c)}
.empty{color:var(--mut);padding:30px;font-family:Barlow}.imgbox{padding:20px;font-family:Barlow}.imgbox img{max-width:100%;border:1px solid var(--line)}
#st{display:flex;gap:16px;padding:4px 12px;background:var(--bg2);border-top:1px solid var(--line);color:var(--mut);font-size:12px;flex:none}
#gut{flex:none;width:6px;background:var(--line);cursor:col-resize;touch-action:none}#main.v #gut{width:auto;height:6px;cursor:row-resize}#gut:hover{background:var(--gold)}
#pvh{display:flex;gap:6px;align-items:center;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
#pvh .t2{font:17px 'Bebas Neue';letter-spacing:1.5px;color:var(--gold);margin-right:auto}
#fw{flex:1;background:#fff;display:flex;justify-content:center;min-height:0;overflow:auto}
#fw.dev{background:repeating-conic-gradient(var(--bg3) 0 25%,var(--bg2) 0 50%) 0 0/20px 20px}
#fw.dev{justify-content:flex-start;align-items:flex-start;overflow:hidden}
#fw.dev #fr{box-shadow:0 6px 30px #0008;border-radius:10px}
#fw.dev.ph #fr{border-radius:26px;outline:6px solid #111}
#fr{border:0;background:#fff;width:100%;height:100%}#fw.tab2 #fr{width:768px}#fw.ph #fr{width:390px}
#pv:fullscreen{background:var(--bg)}
#con{height:130px;overflow:auto;background:var(--bg2);border-top:1px solid var(--line);font:12px/1.5 'JetBrains Mono',monospace;padding:6px 10px;flex:none}
#con.off{display:none}#con div{border-bottom:1px solid var(--line);padding:1px 0}.error{color:var(--t)}.warn{color:var(--n)}.info{color:var(--a)}
#md,#hp,#ex{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}#md.on,#hp.on,#ex.on{display:flex}
#exA{width:100%;height:42vh;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.5 'JetBrains Mono',monospace;resize:none;margin-bottom:10px;white-space:pre}
#exH{margin:0 0 10px;color:var(--mut);font-size:13px}
#hk{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin-bottom:14px;font-size:13px}
#hk b{color:var(--gold2);font:500 12px 'JetBrains Mono',monospace}
.card{background:var(--bg2);border:1px solid var(--gold);border-radius:10px;padding:18px;width:min(360px,90vw)}
.card h3{margin:0 0 12px;font:20px 'Bebas Neue';letter-spacing:1.5px;color:var(--gold)}
.card input{width:100%;padding:8px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;font:inherit;margin-bottom:12px}
.row{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#111;padding:8px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:10;font-weight:600}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:800px){#main{flex-direction:column}#side{width:auto;max-height:34%;border-right:0;border-bottom:1px solid var(--line)}#gut{width:auto;height:6px}.hint{display:none}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="logo">WERK<span>STATT</span></div>
 <button id="bSide" title="Dateiliste ein/aus">☰</button><span class="sep"></span>
 <button id="bProj" title="Neues Projekt mit Starter-Dateien">🆕 Projekt</button>
 <button id="bNew">＋ Neue Datei</button>
 <button id="bOpen">📂 Laden</button>
 <button id="bSaveP">💾 Projekt speichern</button>
 <button id="bSaveF">📄 Datei</button>
 <button id="bZip">🗜 ZIP</button>
 <button id="bOne">🧩 Als 1 HTML</button>
 <button id="bFind">🔍 Suchen</button>
 <span class="sp"></span>
 <button id="bRun" class="pri">▶ Ausführen</button>
 <button id="bAuto" class="on">Auto</button>
 <button id="bLay" title="Layout wechseln">▥ Layout</button>
 <button id="fMin" title="Schrift kleiner">A−</button><button id="fPlus" title="Schrift größer">A+</button>
 <button id="bHelp" title="Tastenkürzel">⌨</button>
 <button id="bTheme">🎨 Styles</button>
 <button id="bFs">⛶ Vollbild</button>
</header>
<div id="main">
 <aside id="side"><div class="sh">DATEIEN <button id="bAdd" title="Neue Datei">＋</button></div><ul id="list"></ul><div class="hint">Dateien per Drag &amp; Drop hierher ziehen. Fahre über eine Datei für Umbenennen, Duplizieren, Löschen.</div></aside>
 <section id="ed"><div id="tabs"></div><div id="sb" hidden><div class="sr1"><input id="q" placeholder="Suchen…" autocomplete="off"><button id="bCase" title="Groß-/Kleinschreibung beachten">Aa</button><button id="bWord" title="Ganzes Wort">Wort</button><button id="bRe" title="Regulärer Ausdruck">.*</button><span id="qc"></span><button id="qp" title="Vorheriger (Umschalt+Enter)">▲</button><button id="qn" title="Nächster (Enter / F3)">▼</button><button id="bAll" title="In allen Dateien suchen (Strg+Umschalt+F)">Alle Dateien</button><button id="qx" title="Schließen (Esc)">✕</button></div><div class="sr1"><input id="rp" placeholder="Ersetzen durch…" autocomplete="off"><button id="rOne">Ersetzen</button><button id="rAll">Alle ersetzen</button></div></div><div id="ew"><div id="ln"></div><pre id="mk"></pre><pre id="hl"></pre><textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div><div id="sr" hidden></div><div id="st"><span id="pos"></span><span id="info"></span><span class="sp"></span><span id="sv"></span></div></section>
 <div id="gut"></div>
 <section id="pv"><div id="pvh"><span class="t2">VORSCHAU</span><button data-d="">🖥</button><button data-d="tab2">▭ Tablet</button><button data-d="ph">📱 Handy</button><button id="bRot" hidden title="Hoch-/Querformat wechseln">↻ Hochformat</button><button id="bCon">Konsole <span id="cn">0</span></button><button id="bRel">⟳</button><button id="bPfs">⛶</button></div><div id="fw"><iframe id="fr" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-downloads" title="Vorschau"></iframe></div><div id="con" class="off"></div></section>
</div>
</div>
<input type="file" id="fin" multiple hidden>
<div id="md"><div class="card"><h3 id="mt"></h3><input id="mi"><div class="row"><button id="mc">Abbrechen</button><button id="mok" class="pri">OK</button></div></div></div>
<div id="hp"><div class="card"><h3>Tastenkürzel</h3><div id="hk"></div><div class="row"><button id="hx" class="pri">Schließen</button></div></div></div>
<div id="ex"><div class="card" style="width:min(680px,94vw)"><h3 id="exT">Export</h3><p id="exH"></p><textarea id="exA" readonly spellcheck="false"></textarea><div class="row"><button id="exC" class="pri">Kopieren</button><button id="exX">Schließen</button></div></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),KEY='werkstatt_v1';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const starter=()=>[
{name:'index.html',content:`<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Projekt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Hallo Werkstatt</h1>
  <p>Bearbeite die Dateien links – die Vorschau aktualisiert sich live.</p>
  <button id="btn">Klick mich</button>
  <p id="out"></p>
</main>
<script src="script.js"><\/script>
</body>
</html>`},
{name:'style.css',content:`:root{--gold:#d4a937}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e0d0b;color:#e8e0cc;font-family:system-ui,sans-serif}
main{text-align:center;padding:2rem}
h1{font-size:3rem;color:var(--gold);letter-spacing:.1em;margin:0 0 .5rem}
button{background:var(--gold);border:0;border-radius:8px;padding:.7rem 1.4rem;font-size:1rem;cursor:pointer}
button:hover{filter:brightness(1.15)}`},
{name:'script.js',content:`let n = 0;
const out = document.getElementById('out');

document.getElementById('btn').addEventListener('click', () => {
  n++;
  out.textContent = 'Geklickt: ' + n + '×';
  console.log('Klick Nr.', n);
});

console.log('Werkstatt bereit ✔');`}];
let S={files:[],tabs:[],active:'',theme:'gold',auto:true,vert:false,fs:13.5,dev:'',land:false};
const cur=()=>S.files.find(f=>f.name===S.active);
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const icon=n=>({html:'🌐',htm:'🌐',css:'🎨',js:'⚡',json:'🧾',md:'📝',svg:'🖼',png:'🖼',jpg:'🖼',jpeg:'🖼',gif:'🖼',webp:'🖼'})[ext(n)]||'📄';
const get=p=>S.files.find(f=>f.name===p.replace(/^\.?\//,''));
const tok=(re,fn)=>c=>{let o='',l=0,m;re.lastIndex=0;while((m=re.exec(c))){o+=esc(c.slice(l,m.index))+fn(m);l=re.lastIndex}return o+esc(c.slice(l))};
const sp=(k,t)=>`<i class=${k}>${esc(t)}</i>`;
const H={
html:c=>c.replace(/(<!--[\s\S]*?-->|<!DOCTYPE[^>]*>)|(<\/?[a-zA-Z][^>]*>?)|([^<]+|<)/gi,(m,a,t,x)=>a?sp('c',a):t?esc(t).replace(/^(&lt;\/?)([\w:-]+)/,'$1<i class=t>$2</i>').replace(/([\w:-]+)=(&quot;[\s\S]*?&quot;|&#39;[\s\S]*?&#39;)/g,'<i class=a>$1</i>=<i class=s>$2</i>'):esc(x)),
js:tok(/(\/\/.*|\/\*[\s\S]*?\*\/)|(`(?:\\[\s\S]|[^`\\])*`|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|while|class|new|import|export|from|async|await|try|catch|throw|switch|case|break|continue|default|this|typeof|of|in|true|false|null|undefined)\b|(\b\d+\.?\d*\b)/g,m=>sp(m[1]?'c':m[2]?'s':m[3]?'k':'n',m[0])),
css:tok(/(\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(@[\w-]+)|(--?[\w-]+)(?=\s*:)|(#[0-9a-fA-F]{3,8}\b|\b\d+\.?\d*(?:px|em|rem|%|vh|vw|s|ms|deg|fr)?)/g,m=>sp(m[1]?'c':m[2]?'s':m[3]?'k':m[4]?'a':'n',m[0]))};
const lang=n=>({htm:'html',html:'html',css:'css',js:'js',mjs:'js',json:'js',svg:'html'})[ext(n)];
const ta=$('#ta'),hl=$('#hl'),ln=$('#ln'),fr=$('#fr');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function ask(t,val,ok){return new Promise(res=>{$('#mt').textContent=t;const i=$('#mi');i.style.display=val===null?'none':'';i.value=val||'';$('#mok').textContent=ok||'OK';$('#md').classList.add('on');if(val!==null){i.focus();i.select()}
const done=v=>{$('#md').classList.remove('on');res(v)};$('#mok').onclick=()=>done(val===null?true:i.value.trim());$('#mc').onclick=()=>done(null);i.onkeydown=e=>{if(e.key==='Enter')$('#mok').click();if(e.key==='Escape')$('#mc').click()}})}
async function save(name,data){if(!data||!data.size&&!data.length){toast('Nichts zu speichern');return}
 let d=null;try{d=window.claude&&await claude.use('downloads')}catch(e){}if(!d){fallback(name,data);return}
 try{await d.save({filename:name,data});toast('Gespeichert: '+name)}catch(e){toast(e&&e.code==='declined'?'Abgebrochen':e&&e.code==='rejected_extension'?(typeof data==='string'?(d.save({filename:name+'.txt',data}).then(()=>toast('Gespeichert als '+name+'.txt – Endung bei Bedarf umbenennen')).catch(()=>{}),'Endung nicht erlaubt – speichere als .txt …'):'Dateityp nicht erlaubt – nutze ZIP oder Projekt speichern'):'Fehler: '+(e&&e.message||e))}}
let t1;const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));$('#sv').textContent='● lokal gespeichert'}catch(e){$('#sv').textContent='Lokaler Speicher voll – bitte Projekt speichern'}};
const later=()=>{$('#sv').textContent='… ungespeichert';clearTimeout(t1);t1=setTimeout(persist,700)};
let t2;const laterRun=()=>{clearTimeout(t2);t2=setTimeout(run,600)};
function renderList(){$('#list').innerHTML=S.files.map(f=>`<li class="${f.name===S.active?'a':''}" data-n="${esc(f.name)}"><span>${icon(f.name)} ${esc(f.name)}</span><span class="ac"><button data-a="ren" title="Umbenennen">✎</button><button data-a="dup" title="Duplizieren">⧉</button><button data-a="del" title="Löschen">🗑</button></span></li>`).join('')}
function renderTabs(){$('#tabs').innerHTML=S.tabs.map(n=>`<div class="tab ${n===S.active?'a':''}" data-n="${esc(n)}"><span>${icon(n)} ${esc(n)}</span><b data-x>×</b></div>`).join('')}
let lastN=0;
function upd(){const f=cur();if(!f||f.data)return;hl.innerHTML=(H[lang(f.name)]||esc)(ta.value)+'\n';const n=ta.value.split('\n').length;if(n!==lastN){lastN=n;ln.textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}
 $('#info').textContent=ta.value.length+' Zeichen · '+(lang(f.name)||'text').toUpperCase();pos();if(typeof refind==='function')refind()}
function pos(){const v=ta.value.slice(0,ta.selectionStart).split('\n');$('#pos').textContent=`Zeile ${v.length}, Spalte ${v[v.length-1].length+1}`}
function loadEd(){const f=cur();lastN=0;$('#mk').innerHTML='';if(!f){ta.hidden=true;ln.textContent='';hl.innerHTML='<div class="empty">Keine Datei geöffnet – wähle links eine aus oder lege eine neue an.</div>';return}
 if(f.data){ta.hidden=true;ln.textContent='';hl.innerHTML=`<div class="imgbox"><img src="${f.data}" alt=""><p>Bilddatei – wird in der Vorschau über den Dateinamen eingebunden.</p></div>`;return}
 ta.hidden=false;ta.value=f.content;const q=POS[f.name];if(q){ta.setSelectionRange(q[0],q[1]);ta.scrollTop=q[2];ta.scrollLeft=q[3]}upd();ta.onscroll()}
const renderAll=()=>{renderList();renderTabs();loadEd()};
function openF(n){savePos();if(!S.tabs.includes(n))S.tabs.push(n);S.active=n;renderAll();if(!ta.hidden)ta.focus();later()}

$('#bProj').onclick=async()=>{if(await ask('Neues Projekt mit Starter-Dateien? Das aktuelle wird ersetzt – speichere es vorher.',null,'Neu starten')){S.files=starter();S.tabs=['index.html'];S.active='index.html';renderAll();run();later();toast('Neues Projekt')}};
/* Export-Ersatz */
function fallback(name,data){try{const b=data instanceof Blob?data:new Blob([data],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){}
 if(typeof data==='string')showExport(name,data);else toast('Download ist in dieser Ansicht nicht möglich – öffne die Seite über den claude.ai-Link oder nutze „Projekt speichern“')}
function showExport(name,text){$('#exT').textContent='Export: '+name;$('#exH').textContent='Der direkte Download ist in dieser Ansicht nicht verfügbar. Kopiere den Inhalt und speichere ihn lokal als „'+name+'“.';const t=$('#exA');t.value=text;$('#ex').classList.add('on');t.focus();t.select()}
$('#exX').onclick=()=>$('#ex').classList.remove('on');
$('#exC').onclick=async()=>{const t=$('#exA');t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(!ok&&navigator.clipboard){try{await navigator.clipboard.writeText(t.value);ok=true}catch(e){}}toast(ok?'In die Zwischenablage kopiert':'Bitte Text markieren und mit Strg+C kopieren')};
/* Start */
(function(){let ok=false;try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.files&&j.files.length){S=Object.assign(S,j);ok=true}}catch(e){}
 if(!ok){S.files=starter();S.tabs=['index.html'];S.active='index.html'}
 if(!get(S.active))S.active=S.tabs[0]||'';
 setTheme();setLay();setFs();setDev();$('#bAuto').classList.toggle('on',S.auto);renderAll();run();if(ok)toast('Projekt wiederhergestellt')})();
</script>
</body>
</html>
